<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anirudh's Playlist Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: a left-to-right flow (library → mood folders → playlists → LateNights) with a detail panel docked beside it.
   Deliberately single-theme: a late-night listening room, ink-blue ground, one colour per mood. */
:root {
  --bg: #0b0d17;
  --surface: #121527;
  --surface-2: #1a1e35;
  --line: #262b47;
  --fg: #ebe8f4;
  --muted: #8d91ad;
  --gold: #f2d48a;
  --ln-zone: rgba(242, 212, 138, 0.045);
  --shadow: rgba(0, 0, 0, 0.5);

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;

  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

/* The page is a one-screen app: header on top, the map canvas fills the rest. */
html, body { height: 100%; }
body {
  margin: 0;
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 var(--f-body);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 16px;
}

/* ---------- header ---------- */
.top {
  width: 100%;
  margin: 0 0 14px;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px 36px;
}
.eyebrow {
  margin: 0 0 6px;
  font: 500 11px/1.2 var(--f-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.brand h1 {
  margin: 0;
  font: 800 clamp(30px, 4.2vw, 46px)/0.95 var(--f-display);
  letter-spacing: -0.025em;
  text-wrap: balance;
}
.brand h1 span { color: var(--gold); }
.tools {
  display: flex;
  flex-wrap: nowrap;
  gap: 8px;
}
.tools input,
.tools button {
  font: 500 14px var(--f-body);
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 14px;
}
.tools input { width: min(260px, 100%); }
.tools input::placeholder { color: var(--muted); }
.tools button { cursor: pointer; white-space: nowrap; }
.tools button:hover { border-color: var(--muted); }
.tools button[aria-pressed="true"] {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--bg);
}
:is(input, button):focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

/* ---------- layout: zoomable map canvas + collapsible details column ---------- */
.layout {
  flex: 1;
  min-height: 0;
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 16px;
}
.layout.details-off { grid-template-columns: minmax(0, 1fr); }
.layout.details-off .panel { display: none; }
.layout:fullscreen { background: var(--bg); padding: 16px; }
.layout:-webkit-full-screen { background: var(--bg); padding: 16px; width: 100%; height: 100%; }
.mapwrap {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  cursor: grab;
}
.mapwrap.dragging { cursor: grabbing; }
#map { display: block; width: 100%; height: 100%; }

.panel {
  min-height: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px 22px;
  overflow: auto;
}

/* Map controls: view toggles top-right, zoom bottom-right. */
.maptools {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 2;
  display: flex;
  gap: 8px;
}
.maptools button,
.zoom button {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--fg);
  box-shadow: 0 6px 16px var(--shadow);
  cursor: pointer;
}
.maptools button {
  font: 500 13px var(--f-body);
  border-radius: 999px;
  padding: 7px 13px;
}
.maptools button:hover, .zoom button:hover { border-color: var(--muted); }
.zoom {
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: absolute;
  right: 12px;
  bottom: calc(var(--sheet-h, 0px) + 12px);
  z-index: 2;
}
.zoom button {
  width: 40px; height: 40px;
  border-radius: 50%;
  font: 600 18px/1 var(--f-body);
}
.zoom button[data-z="fit"] { font: 500 11px/1 var(--f-mono); letter-spacing: 0.04em; }

/* ---------- phone / tablet: full-screen mind map with pinch-zoom, details in a bottom sheet ---------- */
.sheetbar { display: none; }
@media (max-width: 899px), (pointer: coarse) {
  body { padding-block: calc(10px + env(safe-area-inset-top, 0px)) 0; }
  .top { margin: 0 0 10px; gap: 8px 16px; align-items: center; }
  .maptools { display: none; }
  .brand .eyebrow { display: none; }
  .brand h1 { font-size: 24px; }
  .tools { flex: 1 1 100%; flex-wrap: nowrap; }
  .tools input { flex: 1 1 auto; min-width: 0; width: auto; }
  .tools input, .tools button { padding: 7px 12px; font-size: 13.5px; }
  .tools button { white-space: nowrap; }
  #reset { display: none; }

  .layout,
  .layout.details-off {
    display: block;
    position: relative;
    margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  }
  .mapwrap {
    position: absolute;
    inset: 0;
    border-width: 1px 0 0;
    border-radius: 0;
  }
  .zoom { right: max(12px, env(safe-area-inset-right, 0px)); }
  .zoom button { width: 42px; height: 42px; }

  .panel,
  .layout.details-off .panel {
    position: fixed;
    top: auto;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    max-height: 58dvh;
    padding: 0;
    border-width: 1px 0 0;
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -14px 32px var(--shadow);
    overflow: hidden;
  }
  .sheetbar {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    flex: none;
    position: relative;
    padding: 20px max(20px, env(safe-area-inset-right, 0px)) 12px max(20px, env(safe-area-inset-left, 0px));
    background: none;
    border: 0;
    color: var(--fg);
    font: 700 16px/1.2 var(--f-display);
    text-align: left;
    cursor: pointer;
  }
  .sheetbar::before {
    content: "";
    position: absolute;
    top: 8px; left: 50%;
    width: 36px; height: 4px;
    margin-left: -18px;
    border-radius: 2px;
    background: var(--line);
  }
  #sheettitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chev {
    width: 9px; height: 9px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: rotate(45deg) translate(-2px, -2px);
    flex: none;
  }
  .panel.collapsed .chev { transform: rotate(-135deg) translate(-2px, -2px); }
  .panel.collapsed .sheetbar { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  #panelbody {
    overflow: auto;
    overscroll-behavior: contain;
    padding: 4px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  }
  .panel.collapsed #panelbody { display: none; }
  .panel h2 { font-size: 23px; }
}

/* ---------- infographic export (#poster): the map alone ---------- */
/* Windows has no flag emoji, so the exported image uses Noto Color Emoji throughout. */
body.poster {
  --f-display: "Bricolage Grotesque", "Noto Color Emoji", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Noto Color Emoji", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", "Noto Color Emoji", ui-monospace, Consolas, monospace;
}
body.poster { height: auto; display: block; overflow: visible; padding: 0; background: var(--surface); }
body.poster .top, body.poster .panel, body.poster .zoom, body.poster .maptools { display: none; }
body.poster #map { width: auto; height: auto; }
body.poster .layout { display: block; max-width: none; margin: 0; position: static; }
body.poster .mapwrap { position: static; border: 0; border-radius: 0; margin: 0; overflow: visible; }

/* ---------- map ---------- */
.t-head { font: 500 10.5px var(--f-mono); letter-spacing: 0.12em; fill: var(--muted); }
.t-head.gold { fill: var(--gold); }
.t-root { font: 800 18px var(--f-display); fill: var(--fg); }
.t-sub { font: 500 10.5px var(--f-mono); fill: var(--muted); }
.t-folder { font: 600 13.5px var(--f-body); fill: var(--fg); }
.t-count { font: 500 11px var(--f-mono); fill: var(--c); }
.t-pl { font: 500 13px var(--f-body); fill: var(--fg); }
.t-pl .t-full { font-size: 11.5px; font-weight: 400; fill: var(--muted); }
.t-pl.personal { fill: var(--muted); font-style: italic; }
.t-ln { font: 600 14.5px var(--f-display); fill: var(--gold); }
.t-recipe { font: 500 10.5px var(--f-mono); fill: var(--muted); }

.s-root { fill: var(--surface-2); stroke: var(--fg); stroke-opacity: 0.35; }
.s-folder { fill: var(--surface-2); fill: color-mix(in srgb, var(--c) 15%, var(--surface)); stroke: var(--c); stroke-width: 1.2; }
.s-pl { fill: var(--c); }
.s-pl.personal { fill: var(--surface); stroke: var(--c); stroke-width: 1.5; }
.s-ln { fill: var(--surface-2); stroke: var(--gold); stroke-opacity: 0.5; }
.s-ln.personal { stroke-dasharray: 4 4; stroke-opacity: 0.35; }
.ln-zone { fill: var(--ln-zone); }
.hitbox { fill: transparent; }

.edge { fill: none; stroke: var(--c); transition: opacity 0.2s, stroke-width 0.2s; }
.e-root { stroke-width: 2; opacity: 0.45; }
.e-folder { stroke-width: 1.2; opacity: 0.4; }
.e-ln { stroke-width: 1.6; opacity: 0.32; }
.e-ln.same { stroke-dasharray: 4 4; }

.node { cursor: pointer; transition: opacity 0.2s; outline: none; }
.node:hover .t-pl:not(.personal),
.node:hover .t-folder { fill: #fff; }
.node:focus-visible .shape { stroke: var(--fg); stroke-width: 2.5; }
.node.sel .shape { stroke: var(--fg); stroke-width: 2; }
.node.match .t-pl { fill: var(--gold); }

#map.focus .node { opacity: 0.15; }
#map.focus .edge { opacity: 0.05; }
#map.focus .node.on { opacity: 1; }
#map.focus .edge.on { opacity: 0.95; stroke-width: 2.2; }

/* ---------- panel ---------- */
.panel h2 {
  margin: 0 0 6px;
  font: 800 26px/1.1 var(--f-display);
  letter-spacing: -0.015em;
  text-wrap: balance;
}
.panel h3 {
  margin: 20px 0 8px;
  font: 500 10.5px/1.2 var(--f-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.panel p { margin: 0 0 8px; }
.panel .muted { color: var(--muted); }
.panel .eyebrow { display: flex; align-items: center; gap: 8px; color: var(--c, var(--muted)); }
.dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--c, var(--muted));
  flex: none;
}
.code {
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px;
  color: var(--muted);
}
.code b {
  font: 500 12px var(--f-mono);
  color: var(--c, var(--gold));
  border: 1px solid currentColor;
  border-radius: 6px;
  padding: 1px 6px;
}
.note {
  font-size: 13px;
  color: var(--muted);
  border-left: 2px dashed var(--line);
  padding-left: 10px;
}
.examples { margin: 0; padding-left: 18px; }
.examples li { margin-bottom: 2px; }
.badge {
  display: inline-block;
  font: 500 10.5px var(--f-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 8px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  font: 500 13px var(--f-body);
  color: var(--fg);
  background: var(--surface-2);
  background: color-mix(in srgb, var(--c, var(--muted)) 13%, transparent);
  border: 1px solid var(--line);
  border-color: color-mix(in srgb, var(--c, var(--muted)) 50%, transparent);
  border-radius: 999px;
  padding: 4px 11px;
  cursor: pointer;
}
.chip:hover { border-color: var(--c, var(--muted)); }
.chip.ln { --c: var(--gold); }
.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin: 16px 0 4px;
}
.stats div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.stats b {
  display: block;
  font: 800 26px/1 var(--f-display);
  font-variant-numeric: tabular-nums;
}
.stats span { font-size: 12px; color: var(--muted); line-height: 1.3; display: block; margin-top: 4px; }
.folder-list { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.folder-list button {
  width: 100%;
  display: flex; align-items: center; gap: 10px;
  font: 500 14px var(--f-body);
  color: var(--fg);
  background: none;
  border: 0;
  border-radius: 8px;
  padding: 6px 8px;
  text-align: left;
  cursor: pointer;
}
.folder-list button:hover { background: var(--surface-2); }
.folder-list .n { margin-left: auto; font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.group { margin-bottom: 12px; }
.group p { font-size: 13px; color: var(--c); margin-bottom: 6px; }
.back {
  font: 500 12px var(--f-mono);
  color: var(--muted);
  background: none; border: 0; padding: 0; margin-bottom: 14px;
  cursor: pointer;
}
.back:hover { color: var(--fg); }

@media (prefers-reduced-motion: reduce) {
  .edge, .node { transition: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <p class="eyebrow">Anirudh · Spotify</p>
    <h1>Playlist <span>Map</span></h1>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="Find a playlist, code or song" aria-label="Search playlists" autocomplete="off">
    <button id="orphans" type="button" aria-pressed="false">Not in LateNights</button>
    <button id="reset" type="button">Show all</button>
  </div>
</header>

<main class="layout">
  <section class="mapwrap" aria-label="Playlist map">
    <svg id="map" role="group" aria-label="FB Clearance mood folders, playlists and LateNights"></svg>
    <div class="maptools">
      <button id="detailsBtn" type="button" aria-pressed="true" aria-controls="panel">Hide details</button>
      <button id="fsBtn" type="button" aria-pressed="false">Fullscreen</button>
    </div>
    <div class="zoom">
      <button type="button" data-z="in" aria-label="Zoom in">+</button>
      <button type="button" data-z="out" aria-label="Zoom out">−</button>
      <button type="button" data-z="fit" aria-label="Show the whole map">FIT</button>
    </div>
  </section>
  <aside id="panel" class="panel">
    <button id="sheetbar" class="sheetbar" type="button" aria-expanded="true" aria-controls="panelbody">
      <span id="sheettitle"></span><span class="chev" aria-hidden="true"></span>
    </button>
    <div id="panelbody" aria-live="polite"></div>
  </aside>
</main>

<script>
(function () {
  const D = window.SPOTIFY_SYSTEM;
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("map");
  const wrap = svg.parentElement;
  const panel = document.getElementById("panel");
  const panelBody = document.getElementById("panelbody");
  const sheetbar = document.getElementById("sheetbar");
  const sheetTitle = document.getElementById("sheettitle");
  const qInput = document.getElementById("q");
  const orphanBtn = document.getElementById("orphans");
  // Same query as the phone/tablet CSS block: full-screen map with pinch-zoom instead of page scrolling.
  const PZ = matchMedia("(max-width: 899px), (pointer: coarse)");
  const POSTER = location.hash === "#poster";
  if (POSTER) document.body.classList.add("poster");

  if (!D) {
    panelBody.innerHTML = "<h2>Data missing</h2><p>The playlist data block in this file is missing or has a typo.</p>";
    return;
  }

  // ---------- model ----------
  const N = new Map();
  const root = { id: "root", type: "root", name: D.library.name };
  N.set("root", root);
  const folders = D.library.folders.map(f => {
    const n = { id: f.id, type: "folder", data: f, color: f.color, children: f.playlists.map(p => p.id) };
    N.set(f.id, n);
    return n;
  });
  D.library.folders.forEach(f => f.playlists.forEach(p => {
    N.set(p.id, { id: p.id, type: "pl", data: p, folder: f.id, color: f.color, feeds: [] });
  }));
  const lns = D.lateNights.playlists.map(l => {
    const n = { id: l.id, type: "ln", data: l, sources: l.sources };
    N.set(l.id, n);
    l.sources.forEach(s => N.get(s) && N.get(s).feeds.push(l.id));
    return n;
  });
  const playlists = [...N.values()].filter(n => n.type === "pl");
  const orphans = playlists.filter(p => !p.feeds.length);

  let E = [];
  let selected = null;      // {kind:'node', id} | {kind:'orphans'} | {kind:'search', q, hits}
  let hovering = null;
  let MW = 0, MH = 0;       // map content size in SVG units
  let view = null;          // pan-zoom viewport {x, y, w, h} in SVG units
  let fitS = 1, userMoved = false;

  // ---------- helpers ----------
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const curve = (x1, y1, x2, y2) => {
    const m = (x1 + x2) / 2;
    return `C${m},${y1} ${m},${y2} ${x2},${y2}`;
  };
  function nodeG(parent, n, label) {
    const g = el("g", { class: `node n-${n.type}`, tabindex: 0, role: "button", "data-id": n.id, "aria-label": label }, parent);
    if (n.color) g.style.setProperty("--c", n.color);
    n.el = g;
    return g;
  }

  // ---------- layout + render ----------
  function build() {
    svg.textContent = "";
    E = [];
    const ROW = 24, GAP = 20, TOP = 64;
    const gZone = el("g", {}, svg);
    const gE = el("g", { class: "edges" }, svg);
    const gN = el("g", { class: "nodes" }, svg);
    const gH = el("g", { class: "heads" }, svg);

    let y = TOP;
    folders.forEach(f => {
      f.children.forEach(c => { N.get(c).y = y; y += ROW; });
      y += GAP;
    });
    const H = y - GAP + 20;
    folders.forEach(f => {
      const ys = f.children.map(c => N.get(c).y);
      f.y = (ys[0] + ys[ys.length - 1]) / 2;
    });
    root.y = (folders[0].y + folders[folders.length - 1].y) / 2;

    // root
    const xR = 16;
    const rg = nodeG(gN, root, `${root.name}, the whole library`);
    const rt = el("text", { x: xR + 18, y: root.y - 2, class: "t-root" }, rg);
    rt.textContent = root.name;
    const rs = el("text", { x: xR + 18, y: root.y + 15, class: "t-sub" }, rg);
    rs.textContent = `${folders.length} MOODS · ${playlists.length} PLAYLISTS`;
    const rw = Math.max(rt.getBBox().width, rs.getBBox().width) + 36;
    rg.insertBefore(el("rect", { x: xR, y: root.y - 26, width: rw, height: 52, rx: 26, class: "shape s-root" }), rg.firstChild);
    root.x1 = xR + rw;

    // folders
    const xF = root.x1 + 52;
    let maxF = 0;
    folders.forEach(f => {
      const g = nodeG(gN, f, `${f.data.name} folder, ${f.children.length} playlists`);
      const t = el("text", { x: xF + 15, y: f.y + 4.5, class: "t-folder" }, g);
      t.textContent = `${f.data.emoji} ${f.data.name}`;
      const tw = t.getBBox().width;
      const c = el("text", { x: xF + 15 + tw + 10, y: f.y + 4.5, class: "t-count" }, g);
      c.textContent = f.children.length;
      const w = tw + c.getBBox().width + 40;
      g.insertBefore(el("rect", { x: xF, y: f.y - 15, width: w, height: 30, rx: 15, class: "shape s-folder" }), g.firstChild);
      f.x0 = xF; f.x1 = xF + w;
      maxF = Math.max(maxF, f.x1);
    });

    // playlists
    const xP = maxF + 60;
    let maxP = 0;
    playlists.forEach(p => {
      const d = p.data;
      const g = nodeG(gN, p, `${d.name}${d.full ? ", " + d.full : ""}`);
      const hit = el("rect", { x: xP - 10, y: p.y - ROW / 2, height: ROW, width: 10, class: "hitbox" }, g);
      el("circle", { cx: xP, cy: p.y, r: 4.5, class: "shape s-pl" + (d.personal ? " personal" : "") }, g);
      const t = el("text", { x: xP + 13, y: p.y + 4.5, class: "t-pl" + (d.personal ? " personal" : "") }, g);
      t.appendChild(document.createTextNode(d.name));
      const extra = d.personal ? "personal" : d.full;
      if (extra) {
        const s = el("tspan", { class: "t-full", dx: 8 }, t);
        s.textContent = extra;
      }
      p.x0 = xP;
      p.x1 = xP + 13 + t.getBBox().width;
      hit.setAttribute("width", p.x1 - xP + 18);
      maxP = Math.max(maxP, p.x1);
    });

    // LateNights column, each card placed near the average height of its sources
    const bus = maxP + 26, xL = bus + 120, LH = 48, MIN = 60;
    let LW = 180;
    const order = lns.slice().sort((a, b) => avgY(a) - avgY(b));
    function avgY(l) {
      const ys = l.sources.map(s => N.get(s).y);
      return ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : Infinity;
    }
    let prev = TOP + LH / 2 - MIN;
    order.forEach(l => {
      const a = avgY(l);
      l.y = isFinite(a) ? Math.max(a, prev + MIN) : Math.max(prev + MIN, H - LH / 2 - 8);
      prev = l.y;
    });
    let next = H - LH / 2 - 8 + MIN;
    for (let i = order.length - 1; i >= 0; i--) {
      order[i].y = Math.min(order[i].y, next - MIN);
      next = order[i].y;
    }

    const cards = order.map(l => {
      const d = l.data;
      const g = nodeG(gN, l, `${d.name}, pulls from ${d.recipe}`);
      const box = el("rect", { x: xL, y: l.y - LH / 2, height: LH, rx: 10, class: "shape s-ln" + (d.personal ? " personal" : "") }, g);
      const t = el("text", { x: xL + 14, y: l.y - 3, class: "t-ln" }, g);
      t.textContent = d.name;
      const r = el("text", { x: xL + 14, y: l.y + 14, class: "t-recipe" }, g);
      r.textContent = d.recipe;
      LW = Math.max(LW, t.getBBox().width + 28, r.getBBox().width + 28);
      l.x0 = xL;
      return box;
    });
    cards.forEach(box => box.setAttribute("width", LW));
    el("rect", { x: xL - 22, y: 8, width: LW + 38, height: H - 8, rx: 14, class: "ln-zone" }, gZone);

    // column heads
    const heads = [[xR, "LIBRARY"], [xF, "MOOD FOLDERS"], [xP - 4, "PLAYLISTS"]];
    heads.forEach(([x, txt]) => { el("text", { x, y: 32, class: "t-head" }, gH).textContent = txt; });
    el("text", { x: xL, y: 32, class: "t-head gold" }, gH).textContent = "🏆 LATENIGHTS";

    // edges
    function edge(d, cls, color, a, b) {
      const p = el("path", { d, class: "edge " + cls }, gE);
      p.style.setProperty("--c", color);
      E.push({ a, b, el: p });
    }
    folders.forEach(f => edge(`M${root.x1},${root.y} ` + curve(root.x1, root.y, f.x0, f.y), "e-root", f.color, "root", f.id));
    folders.forEach(f => f.children.forEach(c => {
      const p = N.get(c);
      edge(`M${f.x1},${f.y} ` + curve(f.x1, f.y, p.x0 - 7, p.y), "e-folder", f.color, f.id, c);
    }));
    lns.forEach(l => l.sources.forEach(s => {
      const p = N.get(s);
      edge(`M${p.x1 + 8},${p.y} L${bus},${p.y} ` + curve(bus, p.y, xL, l.y),
        "e-ln" + (s === "heaven_ln0" ? " same" : ""), p.color, s, l.id);
    }));

    MW = xL + LW + 20;
    MH = H + 8;
    applyMode(false);
    paint();
  }

  // ---------- sizing: desktop scroll, phone pan-zoom, poster export ----------
  function applyMode(refit) {
    if (POSTER) {
      svg.setAttribute("viewBox", `0 0 ${MW} ${MH}`);
      svg.setAttribute("width", MW);
      svg.setAttribute("height", MH);
      document.body.dataset.size = `${Math.ceil(MW)}x${Math.ceil(MH)}`;
      return;
    }
    wrap.style.setProperty("--sheet-h", sheetH() + "px");
    const r = wrap.getBoundingClientRect();
    if (!r.width || !r.height) return;
    if (!view || refit || !userMoved) {
      fit();
    } else {
      // The frame changed size (window, fullscreen, details panel): keep the zoom level and the centre point.
      const cx = view.x + view.w / 2, cy = view.y + view.h / 2;
      const w = r.width / lastS, h = r.height / lastS;
      setView({ x: cx - w / 2, y: cy - h / 2, w, h });
    }
  }
  const sheetH = () => (PZ.matches ? sheetbar.getBoundingClientRect().height : 0);
  const scale = () => wrap.getBoundingClientRect().width / view.w;
  let lastS = 1;

  function setView(v) {
    const s = wrap.getBoundingClientRect().width / v.w;
    const m = 80 / s; // keep at least 80px of the map on screen
    v.x = Math.min(Math.max(v.x, -v.w + m), MW - m);
    v.y = Math.min(Math.max(v.y, -v.h + m), MH - m);
    view = v;
    lastS = s;
    svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`);
  }
  function fit() {
    const r = wrap.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const pad = 10, padB = sheetH() + 10;
    const aw = r.width - pad * 2, ah = r.height - pad - padB;
    const s = Math.min(aw / MW, ah / MH);
    fitS = s;
    userMoved = false;
    setView({ x: -pad / s - (aw / s - MW) / 2, y: -pad / s - (ah / s - MH) / 2, w: r.width / s, h: r.height / s });
  }
  function zoomAt(k, cx, cy) {
    const r = wrap.getBoundingClientRect();
    const s = scale();
    const ns = Math.min(3, Math.max(fitS * 0.8, s * k));
    const fx = cx - r.left, fy = cy - r.top;
    setView({ x: view.x + fx / s - fx / ns, y: view.y + fy / s - fy / ns, w: r.width / ns, h: r.height / ns });
    userMoved = true;
  }
  function panBy(dx, dy) {
    const s = scale();
    setView({ x: view.x - dx / s, y: view.y - dy / s, w: view.w, h: view.h });
    userMoved = true;
  }
  // Move the view so node n sits in the middle of the visible area, at least at scale minS.
  function centerOn(n, minS) {
    if (!view || !n.el) return;
    const r = wrap.getBoundingClientRect();
    const b = n.el.getBBox();
    const ns = Math.max(scale(), minS);
    const cover = !PZ.matches ? 0 : panel.classList.contains("collapsed") ? sheetH() : panel.getBoundingClientRect().height;
    const visH = r.height - cover;
    const w = r.width / ns, h = r.height / ns;
    const target = { x: b.x + b.width / 2 - w / 2, y: b.y + b.height / 2 - Math.max(visH, 120) / 2 / ns, w, h };
    const from = { ...view };
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const t0 = performance.now(), dur = reduce ? 0 : 280;
    (function step(now) {
      const t = dur ? Math.min(1, Math.max(0, (now - t0) / dur)) : 1;
      const e = 1 - Math.pow(1 - t, 3);
      setView({
        x: from.x + (target.x - from.x) * e, y: from.y + (target.y - from.y) * e,
        w: from.w + (target.w - from.w) * e, h: from.h + (target.h - from.h) * e,
      });
      if (t < 1) requestAnimationFrame(step);
    })(t0);
    userMoved = true;
  }
  // True when the node is outside the map frame or, on phones, under the open details sheet.
  function offscreen(n) {
    if (!n.el) return false;
    const b = n.el.getBoundingClientRect();
    const r = wrap.getBoundingClientRect();
    const bottom = PZ.matches && !panel.classList.contains("collapsed") ? panel.getBoundingClientRect().top - 20 : r.bottom;
    return b.top + b.height / 2 > bottom || b.bottom < r.top || b.right < r.left || b.left > r.right;
  }

  // ---------- highlighting ----------
  function relatedTo(id) {
    const n = N.get(id);
    const s = new Set(["root", id]);
    if (n.type === "root") N.forEach((_, k) => s.add(k));
    if (n.type === "folder") n.children.forEach(c => { s.add(c); N.get(c).feeds.forEach(l => s.add(l)); });
    if (n.type === "pl") { s.add(n.folder); n.feeds.forEach(l => s.add(l)); }
    if (n.type === "ln") n.sources.forEach(c => { s.add(c); s.add(N.get(c).folder); });
    return s;
  }
  function selectionSet() {
    if (!selected) return null;
    if (selected.kind === "node") return selected.id === "root" ? null : relatedTo(selected.id);
    if (selected.kind === "orphans") {
      const s = new Set(["root"]);
      orphans.forEach(p => { s.add(p.id); s.add(p.folder); });
      return s;
    }
    if (selected.kind === "search") {
      const s = new Set();
      selected.hits.forEach(id => relatedTo(id).forEach(x => s.add(x)));
      return s;
    }
    return null;
  }
  function paint() {
    const s = hovering ? relatedTo(hovering) : selectionSet();
    const on = s && !(s.size >= N.size);
    svg.classList.toggle("focus", !!on);
    const hits = selected && selected.kind === "search" ? new Set(selected.hits) : null;
    N.forEach(n => {
      if (!n.el) return;
      n.el.classList.toggle("on", !!on && s.has(n.id));
      n.el.classList.toggle("sel", !!selected && selected.kind === "node" && selected.id === n.id);
      n.el.classList.toggle("match", !!hits && hits.has(n.id));
    });
    E.forEach(e => e.el.classList.toggle("on", !!on && s.has(e.a) && s.has(e.b)));
  }

  // ---------- panel ----------
  const chip = id => {
    const n = N.get(id);
    if (n.type === "ln") return `<button class="chip ln" data-go="${n.id}">${esc(n.data.name)}</button>`;
    const color = n.color ? ` style="--c:${n.color}"` : "";
    const name = n.type === "folder" ? `${n.data.emoji} ${n.data.name}` : n.data.name;
    return `<button class="chip" data-go="${n.id}"${color}><span class="dot"></span>${esc(name)}</button>`;
  };
  const back = `<button class="back" data-go="root" type="button">← Overview</button>`;

  function renderPanel() {
    let html = "", title = "How it fits together";
    if (selected && selected.kind === "node" && selected.id !== "root") {
      const n = N.get(selected.id);
      if (n.type === "pl") html = plPanel(n);
      if (n.type === "folder") html = folderPanel(n);
      if (n.type === "ln") html = lnPanel(n);
      title = n.type === "folder" ? `${n.data.emoji} ${n.data.name}` : n.data.name;
    } else if (selected && selected.kind === "orphans") {
      html = orphanPanel();
      title = "Not in any LateNights";
    } else if (selected && selected.kind === "search") {
      html = searchPanel();
      title = `Search: ${selected.q}`;
    } else {
      html = overviewPanel();
    }
    panelBody.innerHTML = html;
    panelBody.scrollTop = 0;
    panel.scrollTop = 0;
    sheetTitle.textContent = title;
    // On phones the sheet stays folded until something is selected.
    setSheet(!!selected);
  }
  function setSheet(open) {
    panel.classList.toggle("collapsed", !open);
    sheetbar.setAttribute("aria-expanded", String(open));
  }

  function plPanel(n) {
    const d = n.data, f = N.get(n.folder);
    let h = back;
    h += `<p class="eyebrow" style="--c:${f.color}"><span class="dot"></span>${esc(f.data.emoji + " " + f.data.name)}</p>`;
    h += `<h2>${esc(d.name)}</h2>`;
    if (d.full) h += `<p class="code" style="--c:${f.color}">${d.code ? `<b>${esc(d.code)}</b>` : ""}${esc(d.full)}</p>`;
    if (d.personal) h += `<p><span class="badge">Personal</span></p>`;
    if (d.desc) h += `<p>${esc(d.desc)}</p>`;
    if (d.guessed) h += `<p class="note">Guessed from the playlist name and cover. Not confirmed yet.</p>`;
    if (d.examples && d.examples.length) {
      h += `<h3>Sounds like</h3><ul class="examples">${d.examples.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    }
    h += `<h3>LateNights</h3>`;
    h += n.feeds.length
      ? `<p class="muted">Its best songs go into:</p><div class="chips">${n.feeds.map(chip).join("")}</div>`
      : `<p class="muted">Doesn't feed any LateNights yet.</p>`;
    h += `<h3>Same folder</h3><div class="chips">${f.children.filter(c => c !== n.id).map(chip).join("")}</div>`;
    return h;
  }

  function folderPanel(n) {
    const reach = [...new Set(n.children.flatMap(c => N.get(c).feeds))];
    let h = back;
    h += `<p class="eyebrow" style="--c:${n.color}"><span class="dot"></span>Mood folder</p>`;
    h += `<h2>${esc(n.data.emoji + " " + n.data.name)}</h2>`;
    h += `<p class="muted">${n.children.length} playlists. ${reach.length ? `Feeds ${reach.length} LateNights.` : "None of these feed a LateNights."}</p>`;
    h += `<h3>Playlists</h3><div class="chips">${n.children.map(chip).join("")}</div>`;
    if (reach.length) h += `<h3>Reaches LateNights</h3><div class="chips">${reach.map(chip).join("")}</div>`;
    return h;
  }

  function lnPanel(n) {
    const d = n.data;
    let h = back;
    h += `<p class="eyebrow" style="--c:var(--gold)"><span class="dot"></span>LateNights</p>`;
    h += `<h2>${esc(d.name)}</h2>`;
    h += `<p class="code" style="--c:var(--gold)"><b>${esc(d.recipe)}</b></p>`;
    if (d.desc) h += `<p>${esc(d.desc)}</p>`;
    if (n.sources.length) {
      const byFolder = {};
      n.sources.forEach(s => { const p = N.get(s); (byFolder[p.folder] = byFolder[p.folder] || []).push(s); });
      h += `<h3>Pulls its best songs from</h3>`;
      for (const fid in byFolder) {
        const f = N.get(fid);
        h += `<div class="group" style="--c:${f.color}"><p>${esc(f.data.emoji + " " + f.data.name)}</p><div class="chips">${byFolder[fid].map(chip).join("")}</div></div>`;
      }
    }
    return h;
  }

  function orphanPanel() {
    const byFolder = {};
    orphans.forEach(p => { (byFolder[p.folder] = byFolder[p.folder] || []).push(p.id); });
    let h = back;
    h += `<p class="eyebrow">Gaps</p><h2>Not in any LateNights</h2>`;
    h += `<p class="muted">${orphans.length} of ${playlists.length} playlists don't feed a LateNights. Some are personal on purpose. The rest could become a future LN8.</p>`;
    for (const fid in byFolder) {
      const f = N.get(fid);
      h += `<div class="group" style="--c:${f.color}"><p>${esc(f.data.emoji + " " + f.data.name)}</p><div class="chips">${byFolder[fid].map(chip).join("")}</div></div>`;
    }
    return h;
  }

  function searchPanel() {
    let h = back;
    h += `<p class="eyebrow">Search</p><h2>“${esc(selected.q)}”</h2>`;
    if (!selected.hits.length) return h + `<p class="muted">Nothing matches. Try a code like MSR, a mood, or a song name.</p>`;
    h += `<p class="muted">${selected.hits.length} match${selected.hits.length === 1 ? "" : "es"}.</p>`;
    h += `<div class="chips">${selected.hits.map(chip).join("")}</div>`;
    return h;
  }

  function overviewPanel() {
    const feeding = playlists.length - orphans.length;
    let h = `<p class="eyebrow">How it fits together</p><h2>Two layers</h2>`;
    h += `<p><b>FB Clearance</b> is the mood library: ${folders.length} folders and ${playlists.length} playlists, for when you're listening on your own.</p>`;
    h += `<p><b style="color:var(--gold)">LateNights</b> is the best of the best, for when you have the aux. Each one pulls the top songs from specific playlists.</p>`;
    h += `<div class="stats">
      <div><b>${playlists.length}</b><span>playlists</span></div>
      <div><b>${feeding}</b><span>feed a LateNights</span></div>
      <div><b>${orphans.length}</b><span>don't</span></div>
    </div>`;
    h += `<h3>Mood folders</h3><ul class="folder-list">`;
    folders.forEach(f => {
      h += `<li><button type="button" data-go="${f.id}" style="--c:${f.color}"><span class="dot"></span>${esc(f.data.emoji + " " + f.data.name)}<span class="n">${f.children.length}</span></button></li>`;
    });
    h += `</ul>`;
    h += `<h3>LateNights</h3><div class="chips">${lns.map(l => chip(l.id)).join("")}</div>`;
    h += `<p class="muted" style="margin-top:18px;font-size:13px">Hover or tap anything on the map to trace its connections. Pinch (or Ctrl + scroll) to zoom, scroll or drag to move, and press FIT to see everything again. Hollow dots and italics are personal playlists. A dashed line means the same playlist sits in both layers.</p>`;
    return h;
  }

  // ---------- actions ----------
  function select(id, scroll) {
    hovering = null;
    selected = id === "root" ? null : { kind: "node", id };
    qInput.value = "";
    orphanBtn.setAttribute("aria-pressed", "false");
    paint();
    renderPanel();
    const n = N.get(id);
    if (!n || !n.el || id === "root" || !view) return;
    // Chips jump to the node at a readable size; taps only move the map if the node is out of sight.
    if (scroll) centerOn(n, 1);
    else if (offscreen(n)) centerOn(n, 0);
  }
  function clearAll() {
    selected = null;
    hovering = null;
    qInput.value = "";
    orphanBtn.setAttribute("aria-pressed", "false");
    paint();
    renderPanel();
  }

  // ---------- touch / mouse pan-zoom (phones and tablets) ----------
  const pts = new Map();
  let start = null, dragging = false, suppressClick = false;
  wrap.addEventListener("pointerdown", e => {
    if (POSTER || !view || e.target.closest(".zoom, .maptools")) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (pts.size === 0) { dragging = false; suppressClick = false; start = { x: e.clientX, y: e.clientY }; }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size > 1) dragging = true;
  });
  wrap.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    if (pts.size === 1) {
      if (!dragging) {
        if (Math.hypot(e.clientX - start.x, e.clientY - start.y) < 8) return;
        dragging = true;
        wrap.classList.add("dragging");
        try { wrap.setPointerCapture(e.pointerId); } catch (_) {}
      }
      panBy(e.clientX - prev.x, e.clientY - prev.y);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    } else if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d0 = Math.hypot(a.x - b.x, a.y - b.y), m0 = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const [a2, b2] = [...pts.values()];
      const d1 = Math.hypot(a2.x - b2.x, a2.y - b2.y), m1 = { x: (a2.x + b2.x) / 2, y: (a2.y + b2.y) / 2 };
      if (d0 > 0) zoomAt(d1 / d0, m1.x, m1.y);
      panBy(m1.x - m0.x, m1.y - m0.y);
    }
  });
  function endPointer(e) {
    if (!pts.delete(e.pointerId)) return;
    if (pts.size === 0) { suppressClick = dragging; wrap.classList.remove("dragging"); }
  }
  wrap.addEventListener("pointerup", endPointer);
  wrap.addEventListener("pointercancel", endPointer);
  wrap.addEventListener("wheel", e => {
    if (!view) return;
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? wrap.clientHeight : 1;
    const dx = e.deltaX * unit, dy = e.deltaY * unit;
    // Touchpad pinch (and Ctrl + mouse wheel) arrives as a wheel event with ctrlKey set: zoom.
    // A plain two-finger slide or mouse wheel moves the map; Shift + wheel moves sideways.
    if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-Math.max(-50, Math.min(50, dy)) * 0.01), e.clientX, e.clientY);
    else if (e.shiftKey && !dx) panBy(-dy, 0);
    else panBy(-dx, -dy);
  }, { passive: false });
  // Safari on Mac reports touchpad pinches as gesture events instead of ctrl + wheel.
  // On iPhone/iPad the pointer handlers already do the pinch, so only act when no touch is down.
  let gestureScale = 1;
  wrap.addEventListener("gesturestart", e => { e.preventDefault(); gestureScale = 1; });
  wrap.addEventListener("gesturechange", e => {
    e.preventDefault();
    if (!view || pts.size) return;
    zoomAt(e.scale / gestureScale, e.clientX, e.clientY);
    gestureScale = e.scale;
  });
  wrap.querySelector(".zoom").addEventListener("click", e => {
    const b = e.target.closest("[data-z]");
    if (!b || !view) return;
    const r = wrap.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + (r.height - sheetH()) / 2;
    if (b.dataset.z === "in") zoomAt(1.5, cx, cy);
    if (b.dataset.z === "out") zoomAt(1 / 1.5, cx, cy);
    if (b.dataset.z === "fit") fit();
  });
  sheetbar.addEventListener("click", () => setSheet(panel.classList.contains("collapsed")));
  // Any change to the map frame's size (window, fullscreen, details panel) re-sizes the view.
  let sizeFrame = 0;
  new ResizeObserver(() => {
    cancelAnimationFrame(sizeFrame);
    sizeFrame = requestAnimationFrame(() => { if (MW) applyMode(false); });
  }).observe(wrap);
  PZ.addEventListener("change", () => applyMode(true));

  // Keyboard: + / - zoom, 0 fits the whole map (ignored while typing in search).
  document.addEventListener("keydown", e => {
    if (!view || e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    const r = wrap.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + (r.height - sheetH()) / 2;
    if (e.key === "+" || e.key === "=") zoomAt(1.5, cx, cy);
    else if (e.key === "-" || e.key === "_") zoomAt(1 / 1.5, cx, cy);
    else if (e.key === "0") fit();
    else return;
    e.preventDefault();
  });

  // Details panel on/off (remembered in this browser) and fullscreen for the map + panel.
  const layout = wrap.parentElement;
  const detailsBtn = document.getElementById("detailsBtn");
  const fsBtn = document.getElementById("fsBtn");
  function setDetails(on) {
    layout.classList.toggle("details-off", !on);
    detailsBtn.setAttribute("aria-pressed", String(on));
    detailsBtn.textContent = on ? "Hide details" : "Show details";
    try { localStorage.setItem("pm-details", on ? "1" : "0"); } catch (_) {}
  }
  let detailsOn = true;
  try { detailsOn = localStorage.getItem("pm-details") !== "0"; } catch (_) {}
  setDetails(detailsOn);
  detailsBtn.addEventListener("click", () => setDetails(layout.classList.contains("details-off")));

  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
  if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) fsBtn.hidden = true;
  fsBtn.addEventListener("click", () => {
    if (fsElement()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const req = layout.requestFullscreen || layout.webkitRequestFullscreen;
      if (req) Promise.resolve(req.call(layout)).catch(() => {});
    }
  });
  function syncFullscreen() {
    const on = !!fsElement();
    fsBtn.textContent = on ? "Exit fullscreen" : "Fullscreen";
    fsBtn.setAttribute("aria-pressed", String(on));
  }
  document.addEventListener("fullscreenchange", syncFullscreen);
  document.addEventListener("webkitfullscreenchange", syncFullscreen);

  svg.addEventListener("click", e => {
    if (suppressClick) { suppressClick = false; return; }
    const g = e.target.closest(".node");
    if (g) select(g.dataset.id, false);
    else clearAll();
  });
  svg.addEventListener("keydown", e => {
    const g = e.target.closest && e.target.closest(".node");
    if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(g.dataset.id, false); }
  });
  if (matchMedia("(hover: hover)").matches) {
    svg.addEventListener("pointerover", e => {
      const g = e.target.closest(".node");
      const id = g ? g.dataset.id : null;
      if (id !== hovering) { hovering = id; paint(); }
    });
    svg.addEventListener("pointerleave", () => { hovering = null; paint(); });
  }
  panelBody.addEventListener("click", e => {
    const b = e.target.closest("[data-go]");
    if (b) select(b.dataset.go, true);
  });
  orphanBtn.addEventListener("click", () => {
    const on = orphanBtn.getAttribute("aria-pressed") !== "true";
    qInput.value = "";
    selected = on ? { kind: "orphans" } : null;
    orphanBtn.setAttribute("aria-pressed", String(on));
    paint();
    renderPanel();
  });
  document.getElementById("reset").addEventListener("click", clearAll);
  qInput.addEventListener("input", () => {
    const q = qInput.value.trim().toLowerCase();
    orphanBtn.setAttribute("aria-pressed", "false");
    if (!q) { selected = null; paint(); renderPanel(); return; }
    const hits = [];
    N.forEach(n => {
      if (n.type === "root") return;
      const d = n.data;
      const hay = [d.name, d.code, d.full, d.desc, d.recipe, ...(d.examples || [])].filter(Boolean).join(" ").toLowerCase();
      if (hay.includes(q)) hits.push(n.id);
    });
    selected = { kind: "search", q: qInput.value.trim(), hits };
    paint();
    renderPanel();
  });

  renderPanel();
  build();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { build(); document.body.dataset.ready = "1"; });
})();
</script>
</body>
</html>
